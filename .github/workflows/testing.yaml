name: Testing Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use pnpm 🗜️
        uses: pnpm/action-setup@v5
        with:
          version: 11
          run_install: false

      - name: Use Node.js 🐢
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies 🧱
        run: pnpm install

      - name: Lint 👕
        run: pnpm lint

  test:
    needs: [lint]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use pnpm 🗜️
        uses: pnpm/action-setup@v5
        with:
          version: 11
          run_install: false

      - name: Use Node.js 🐢
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies 🧱
        run: pnpm install

      - name: Unit tests 🧪
        run: pnpm test